tracker_type: tracktrack
track_high_thresh: 0.25    # was 0.6 -- matches ByteTrack's gate for starting a track
track_low_thresh: 0.1      # matches the conf=0.1 fix: let weak detections help maintain tracks
new_track_thresh: 0.25     # was 0.7 -- was rejecting real vehicles below this confidence
track_buffer: 30
match_thresh: 0.7
lost_match_thr: 0.9

iou_weight: 0.5
reid_weight: 0.5
conf_weight: 0.1
angle_weight: 0.05

penalty_p: 0.2
penalty_q: 0.4
reduce_step: 0.05

tai_thr: 0.55
min_track_len: 3

gmc_method: sparseOptFlow

with_reid: True
model: auto
